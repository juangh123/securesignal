version: 2

# Policy: never auto-open major-version PRs; group minor/patch updates into one
# reviewable PR per ecosystem; keep Python hash-locked dependency bumps manual
# (Dependabot security updates still open their own PRs).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      contracts-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/tee-service"
    schedule:
      interval: "weekly"
    # Version updates off; the hash-locked runtime deps are upgraded manually.
    # Dependabot security updates are a separate feature and still open PRs.
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/tee-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
