version: 2
updates:
  # Keep the CI/monitoring workflows' actions current without hand-editing
  # pinned revisions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tee-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The production Dockerfile pins the Python base image by digest; keep the
  # digest fresh via reviewable Dependabot PRs.
  - package-ecosystem: "docker"
    directory: "/tee-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
