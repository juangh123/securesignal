# Scheduled read-only health check for the real enclave path.
# A failed run notifies repository watchers; GitHub may delay scheduled runs
# under load, so this is monitoring, not a hard real-time SLA.
name: live-health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    name: live TEE + on-chain health
    # Advisory by default: the enclave, the relayer and Coston2 are external
    # dependencies, so their downtime is reported here rather than failing the
    # workflow. Set the repository variable LIVE_STRICT=true to make a failed
    # check blocking (and therefore notifying) again.
    continue-on-error: ${{ vars.LIVE_STRICT != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (viem for ops-status)
        run: npm ci --prefix frontend
      - name: Live health, attestation and relayer balance
        env:
          TEE_URL: https://d1tubqcwiwwev5.cloudfront.net
          REQUIRE_REAL_TEE: "1"
          EXPECT_ATTESTATION_MODE: aws-nitro-enclaves
          RELAYER_ADDRESS: "0x0A3452C5B96396F186bD2d7ed793F8701A88fF72"
        run: node tools/ops-status.mjs
