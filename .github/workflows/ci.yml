name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tee-service:
    name: tee-service · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tee-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the production image (python:3.11-slim in tee-service/Dockerfile).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tee-service/requirements.txt
            tee-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests (offline — no RPC, no on-chain writes)
        env:
          ANALYSIS_OFFLINE: "1"
        run: python -m pytest -q

  contracts:
    name: contracts · hardhat test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile and test
        run: npm test

  frontend:
    name: frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          # Required at import time by src/config.ts. Any non-empty value is
          # enough to compile; real deploys set the production project id.
          NEXT_PUBLIC_PROJECT_ID: ci-build-placeholder
        run: npm run build

  tooling:
    name: tooling · scripts and evidence syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node syntax
        run: |
          node --check tools/ops-status.mjs
          node --check frontend/e2e/e2e-coston2.mjs
          node --check frontend/e2e/e2e-local.mjs
      - name: JSON evidence files
        run: |
          python -m json.tool deploy/aws/deployment-policy.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-18.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-18-verification.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-20.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-20-verification.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-21.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-21-verification.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-22.json > /dev/null
          python -m json.tool deliverables/aws-nitro-attestation-22-verification.json > /dev/null
          python -m json.tool deliverables/coston2-smoke-task-19.json > /dev/null
          python -m json.tool deliverables/ftso-live-check-2026-10-02.json > /dev/null
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem deploy/aws/*.ps1 | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors
            ) | Out-Null
          }
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Validate the EC2 user-data bash template
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("deploy/aws/deploy-nitro-enclaves.ps1").read_text(encoding="utf-8")
          match = re.search(r"\$userDataTemplate\s*=\s*@'\n(.*?)\n'@", text, re.S)
          if not match:
              raise SystemExit("user-data template not found in deploy-nitro-enclaves.ps1")
          Path("/tmp/securesignal-userdata.sh").write_text(match.group(1), encoding="utf-8")
          PY
          bash -n /tmp/securesignal-userdata.sh

  live-health:
    # GitHub's schedule trigger is best-effort and has not started these cron
    # workflows reliably, so also verify the live deployment on every push to
    # main. Read-only: no transactions, no AWS mutations.
    name: live TEE + on-chain health
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (viem for ops-status)
        run: npm ci --prefix frontend
      - name: Live health, attestation, PCR0 and relayer balance
        env:
          TEE_URL: https://d1tubqcwiwwev5.cloudfront.net
          REQUIRE_REAL_TEE: "1"
          EXPECT_ATTESTATION_MODE: aws-nitro-enclaves
          RELAYER_ADDRESS: "0x0A3452C5B96396F186bD2d7ed793F8701A88fF72"
        run: |
          for attempt in 1 2 3; do
            if node tools/ops-status.mjs; then
              exit 0
            fi
            echo "live health attempt ${attempt} failed; retrying in 20s" >&2
            sleep 20
          done
          echo "live health failed after 3 attempts" >&2
          exit 1

  docker:
    name: tee-service · docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t securesignal-tee:ci ./tee-service
