# Render Blueprint — SecureSignal TEE 服务（方案 A）
# 使用方式：Render Dashboard → New → Blueprint → 选择本仓库，或在 New Web Service
# 时选择 Docker 运行时并指向 tee-service/ 目录。
# 密钥类 env 不入库（sync: false），在 Render Dashboard 手动填写。

services:
  - type: web
    name: securesignal-tee
    runtime: docker
    dockerContext: ./tee-service
    dockerfilePath: ./tee-service/Dockerfile
    plan: free
    healthCheckPath: /public-key
    envVars:
      - key: RPC_URL
        value: https://coston2-api.flare.network/ext/C/rpc
      - key: TEE_IMAGE_DIGEST
        value: dev # 接真实 vTPM 后改为镜像 digest（deployment.md §3.3）
      - key: ALLOWED_ORIGINS
        # 部署 Vercel 后改为：https://<你的项目>.vercel.app
        value: http://localhost:3000
      - key: TEE_PRIVATE_KEY
        sync: false # TEE 签名/解密密钥（0x + 64 hex），dashboard 手填
      - key: PRIVATE_KEY
        sync: false # relayer 上链账户（与 contracts/.env 同一部署账户），dashboard 手填
