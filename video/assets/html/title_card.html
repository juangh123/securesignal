<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:radial-gradient(1200px 700px at 70% 20%,#1e293b 0%,#0f172a 60%,#020617 100%);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f1f5f9;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(230,32,99,.18) 0%,transparent 65%);top:-300px;right:-200px}
.glow2{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.12) 0%,transparent 65%);bottom:-300px;left:-150px}
.lock{font-size:96px;margin-bottom:24px}
h1{font-size:110px;font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#f8fafc 30%,#94a3b8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:40px;color:#94a3b8;margin-top:18px;font-weight:400;letter-spacing:1px}
.sub b{color:#34d399;font-weight:600}
.badge{margin-top:56px;padding:14px 34px;border:1px solid #334155;border-radius:999px;background:rgba(30,41,59,.6);font-size:24px;color:#cbd5e1;letter-spacing:.5px}
.badge span{color:#fb7185;font-weight:600}
.line{width:120px;height:4px;border-radius:2px;background:linear-gradient(90deg,#e62063,#34d399);margin-top:40px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="lock">🔐</div>
<h1>SecureSignal</h1>
<div class="sub">Confidential Portfolio Intelligence on <b>Flare</b></div>
<div class="badge">Flare Summer Signal Hackathon &nbsp;·&nbsp; <span>Bounty 2 — Confidential Compute Apps</span></div>
<div class="line"></div>
</body></html>
