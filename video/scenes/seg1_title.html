<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/html/v2_common.css">
<style>
body{background:radial-gradient(1200px 800px at 50% 30%,#0c1526 0%,#070b17 55%,#04060c 100%)}
#particles{position:fixed;inset:0;width:1920px;height:1080px;z-index:1;opacity:.75}
#radar{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:600px;height:600px;z-index:2;opacity:.5}
.center{position:relative;z-index:3;text-align:center}
.shield{width:158px;height:158px;margin:0 auto 36px;opacity:0;animation:ss-pop .7s cubic-bezier(.34,1.56,.64,1) .15s forwards;filter:drop-shadow(0 0 36px rgba(52,211,153,.55))}
h1{font-size:134px;font-weight:700;letter-spacing:-3px;line-height:1;opacity:0;animation:ss-fadeUp .8s ease-out .75s forwards}
.sub{font-size:38px;color:#8fa3c8;margin-top:26px;opacity:0;animation:ss-fadeUp .7s ease-out 2.55s forwards}
.sub b{color:#34d399;font-weight:600}
.badge{margin-top:52px;display:inline-flex;align-items:center;gap:14px;padding:15px 36px;border:1px solid rgba(96,165,250,.35);border-radius:999px;background:rgba(15,23,42,.72);font-size:23px;letter-spacing:1.5px;color:#c7d6f5;opacity:0;animation:ss-fadeUp .7s ease-out 3.95s forwards}
.badge .dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399;animation:ss-blink 1.4s ease-in-out infinite}
.badge span{color:#fb5c7c;font-weight:600}
.mono{position:absolute;left:60px;bottom:52px;font-family:Consolas,monospace;font-size:19px;letter-spacing:3px;color:#5b729c;opacity:0;animation:ss-fadeIn .8s ease-out 5.1s forwards}
.eq{position:absolute;right:60px;bottom:40px;display:flex;align-items:flex-end;gap:5px;height:64px;z-index:3;opacity:0;animation:ss-fadeIn .6s ease-out 1.1s forwards}
.eq i{width:6px;border-radius:3px;background:linear-gradient(180deg,#34d399,#1d4ed8);animation:eqb 1s ease-in-out infinite}
.eq i:nth-child(1){height:20px;animation-delay:0s}.eq i:nth-child(2){height:44px;animation-delay:.12s}.eq i:nth-child(3){height:64px;animation-delay:.24s}.eq i:nth-child(4){height:38px;animation-delay:.36s}.eq i:nth-child(5){height:56px;animation-delay:.48s}.eq i:nth-child(6){height:26px;animation-delay:.6s}.eq i:nth-child(7){height:48px;animation-delay:.18s}.eq i:nth-child(8){height:62px;animation-delay:.3s}
@keyframes eqb{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
</style></head><body>
<canvas id="particles"></canvas>
<div class="center">
  <svg class="shield" viewBox="0 0 120 140" fill="none">
    <path d="M60 8 108 27v44c0 33-20 53-48 61-28-8-48-28-48-61V27Z" stroke="#34d399" stroke-width="5" fill="rgba(10,20,35,.88)"/>
    <path d="M46 60v-14a14 14 0 0 1 28 0v14" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <rect x="42" y="60" width="36" height="26" rx="5" fill="#34d399"/>
    <circle cx="60" cy="73" r="4.5" fill="#04120d"/>
  </svg>
  <h1 class="ss-grad-text">SecureSignal</h1>
  <div class="sub">Confidential Portfolio Intelligence on <b>Flare</b></div>
  <div class="badge"><span class="dot"></span>FLARE SUMMER SIGNAL HACKATHON 🔥 <span>BOUNTY 2 · CONFIDENTIAL COMPUTE APPS</span></div>
</div>
<canvas id="radar"></canvas>
<div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="mono">E2E ENCRYPTED · ATTESTED · ON-CHAIN</div>
<script src="../assets/html/v2_common.js"></script>
<script>
SS.particles(document.getElementById("particles"), { count: 46, color: "rgba(96,165,250,", linkDist: 160 });
SS.radar(document.getElementById("radar"), { color: "#34d399" });
SS.scanlines(0.05);
SS.vignette();
</script>
</body></html>
